plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quransharif.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.quransharif.app'
        minSdk 23
        targetSdk 35

        versionCode System.getenv("GITHUB_RUN_NUMBER") ?
                System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1

        versionName project.findProperty("versionName") ?: "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register("copyWebAssets", Copy) {
    from rootProject.file("../www")
    into file("$projectDir/src/main/assets/www")
}

preBuild.dependsOn("copyWebAssets")
